name: Secret Scanning

on:
  pull_request:
  push:
    branches:
      - main
      - backend-dev
      - frontend-dev

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks history and working-tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  redacted-pattern-scan:
    name: Repository secret-pattern guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run redacted secret scanner
        run: npm run security:secrets
